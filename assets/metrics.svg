<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="362" viewBox="0 0 1200 362" role="img" aria-labelledby="title description">
  <title id="title">2026 engineering ledger</title>
  <desc id="description">2064 contributions, 93 pull requests opened, 79 pull requests merged, 1652 commits analyzed, 2.95 million lines added, and 2.31 million lines removed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08151e"/>
      <stop offset="1" stop-color="#102d3c"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#55d6c2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="362" rx="24" fill="url(#bg)"/>
  <text x="48" y="49" fill="#f5f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">Engineering ledger</text>
  <text x="1152" y="47" text-anchor="end" fill="#7f9ba4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5">YEAR TO DATE / 2026</text>
  <rect x="48" y="67" width="1104" height="2" rx="1" fill="url(#rule)" opacity="0.8"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(48 92)">
      <rect width="352" height="92" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="48" fill="#f5f1e8" font-size="30" font-weight="750">2,064</text>
      <text x="22" y="72" fill="#8fe3d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">CONTRIBUTIONS</text>
    </g>
    <g transform="translate(424 92)">
      <rect width="352" height="92" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="48" fill="#f5f1e8" font-size="30" font-weight="750">93</text>
      <text x="22" y="72" fill="#ffbd6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">PULL REQUESTS OPENED</text>
    </g>
    <g transform="translate(800 92)">
      <rect width="352" height="92" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="48" fill="#f5f1e8" font-size="30" font-weight="750">79</text>
      <text x="22" y="72" fill="#8fe3d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">PULL REQUESTS MERGED</text>
    </g>
    <g transform="translate(48 204)">
      <rect width="352" height="92" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="48" fill="#f5f1e8" font-size="30" font-weight="750">1,652</text>
      <text x="22" y="72" fill="#ffbd6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">COMMITS ANALYZED</text>
    </g>
    <g transform="translate(424 204)">
      <rect width="352" height="92" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="48" fill="#f5f1e8" font-size="30" font-weight="750">+2.95M</text>
      <text x="22" y="72" fill="#8fe3d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">LINES ADDED</text>
    </g>
    <g transform="translate(800 204)">
      <rect width="352" height="92" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="22" y="48" fill="#f5f1e8" font-size="30" font-weight="750">-2.31M</text>
      <text x="22" y="72" fill="#ffbd6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">LINES REMOVED</text>
    </g>
  </g>

  <text x="48" y="335" fill="#7f9ba4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">DEFAULT-BRANCH ACTIVITY ACROSS 4 REPOSITORIES</text>
  <text x="1152" y="335" text-anchor="end" fill="#7f9ba4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">UPDATED JUL 21, 2026</text>
</svg>
