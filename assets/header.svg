<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Anoop Kondepudi</title>
  <desc id="description">AI systems and product engineering. Turning messy workflows into reliable software.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="0.55" stop-color="#0b2230"/>
      <stop offset="1" stop-color="#13384a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#55d6c2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9f3ef" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <path d="M0 276C230 214 388 330 612 260C829 191 971 226 1200 110V320H0Z" fill="#55d6c2" fill-opacity="0.045"/>

  <rect x="72" y="55" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="91" fill="#8fe3d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">AI SYSTEMS / PRODUCT ENGINEERING</text>
  <text x="68" y="176" fill="#f5f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Anoop Kondepudi</text>
  <text x="73" y="224" fill="#b9cbd0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Turning messy workflows into reliable software.</text>
  <text x="73" y="265" fill="#ffbd6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">BUILD  /  OBSERVE  /  SHIP  /  ITERATE</text>

  <g transform="translate(906 160)">
    <circle r="104" fill="none" stroke="#8fe3d6" stroke-opacity="0.16"/>
    <circle r="72" fill="none" stroke="#ffbd6b" stroke-opacity="0.19" stroke-dasharray="5 9"/>
    <path d="M-79 46L-25-22L27 13L82-59" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0b2230" stroke-width="3" filter="url(#glow)">
      <circle cx="-79" cy="46" r="8" stroke="#ffb454"/>
      <circle cx="-25" cy="-22" r="8" stroke="#55d6c2"/>
      <circle cx="27" cy="13" r="8" stroke="#ffb454"/>
      <circle cx="82" cy="-59" r="8" stroke="#55d6c2"/>
    </g>
    <path d="M-15-83C25-102 67-86 91-55" fill="none" stroke="#f5f1e8" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M-91 54C-61 93-14 105 28 92" fill="none" stroke="#f5f1e8" stroke-opacity="0.13" stroke-width="2"/>
  </g>

  <circle cx="1125" cy="58" r="3" fill="#ffbd6b"/>
  <circle cx="1150" cy="83" r="2" fill="#8fe3d6"/>
  <circle cx="1098" cy="91" r="2" fill="#f5f1e8" fill-opacity="0.6"/>
</svg>
